aid: meshcrafts
name: Meshcrafts
description: >-
  Meshcrafts, operating publicly as CURRENT (Current Eco AS, formerly Meshcrafts
  AS, of Oslo, Norway), is a charge point management system (CPMS) provider for
  electric vehicle (EV) charging infrastructure. Its cloud platform lets location
  owners and charge point operators manage EV charging points, handle payment and
  invoicing, apply smart energy management and load balancing, and offer white-label
  charging experiences to drivers. The platform is hardware-agnostic and OCPP
  (Open Charge Point Protocol) certified for OCPP 1.6 and OCPP 2.0.1, including
  Advanced Security, and advertises 99% uptime. Current was the first in the Nordics
  to reach OCPP 2.0.1 CORE and Advanced Security. The company is backed by 500 Global
  and surfaced in the API Evangelist network through that portfolio.
